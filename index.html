<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Volume Button Test</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }

    #number {
      font-size: 5rem;
      margin-bottom: 20px;
      color: red; /* default color */
    }

    #info {
      font-size: 0.9rem;
      text-align: center;
      opacity: 0.8;
      max-width: 320px;
    }
  </style>
</head>
<body>
  <div id="number">0</div>
  <div id="info">
    Try pressing your phone volume up and volume down while this page is focused.<br><br>
    Fallback: On a keyboard, use Arrow Up to increase the number and Arrow Down to cycle color.
  </div>

  <script>
    const numberEl = document.getElementById("number");

    let value = 0;
    const colors = ["red", "blue", "yellow"];
    let colorIndex = 0; // 0 = red by default

    function updateNumber() {
      numberEl.textContent = value;
    }

    function cycleColor() {
      colorIndex = (colorIndex + 1) % colors.length;
      numberEl.style.color = colors[colorIndex];
    }

    document.addEventListener("keydown", function (e) {
      // Try hardware volume keys where supported
      if (e.key === "AudioVolumeUp" || e.keyCode === 175) {
        e.preventDefault();
        value += 1;
        updateNumber();
      } else if (e.key === "AudioVolumeDown" || e.keyCode === 174) {
        e.preventDefault();
        cycleColor();
      }

      // Fallback for desktop keyboard arrows
      if (e.key === "ArrowUp") {
        value += 1;
        updateNumber();
      } else if (e.key === "ArrowDown") {
        cycleColor();
      }
    });

    // Initial state
    updateNumber();
    numberEl.style.color = colors[colorIndex];
  </script>
</body>
</html>
