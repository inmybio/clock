<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Voice Number Capture</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin-top: 60px;
    }
    #startBtn {
      padding: 12px 24px;
      font-size: 18px;
      cursor: pointer;
    }
    #status {
      margin-top: 20px;
      font-size: 16px;
    }
    #numberDisplay {
      margin-top: 30px;
      font-size: 40px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h1>Say a Number</h1>
  <button id="startBtn">Turn On Microphone</button>
  <div id="status">Click the button and then say a number.</div>
  <div id="numberDisplay"></div>

  <script>
    // Get DOM elements
    const startBtn = document.getElementById("startBtn");
    const statusDiv = document.getElementById("status");
    const numberDisplay = document.getElementById("numberDisplay");

    // Web Speech API setup
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    if (!SpeechRecognition) {
      statusDiv.textContent = "Speech recognition is not supported in this browser.";
      startBtn.disabled = true;
    } else {
      const recognition = new SpeechRecognition();
      recognition.lang = "en-US";
      recognition.continuous = true;      // keep listening until we stop it
      recognition.interimResults = true;  // we can catch the number as soon as it appears

      let listening = false;
      let captured = false;

      // Helper to search for the first digit sequence in text
      function findFirstNumberInText(text) {
        const match = text.match(/\d+/);
        return match ? match[0] : null;
      }

      startBtn.addEventListener("click", () => {
        if (listening) {
          // Optional: stop if user clicks again
          recognition.stop();
          listening = false;
          statusDiv.textContent = "Stopped listening.";
          return;
        }

        // Reset state
        captured = false;
        numberDisplay.textContent = "";
        statusDiv.textContent = "Listening... say a number.";
        recognition.start();
        listening = true;
      });

      recognition.onresult = (event) => {
        if (captured) return;

        let fullTranscript = "";

        // Combine all results into one string, so we can find the first number
        for (let i = 0; i < event.results.length; i++) {
          fullTranscript += event.results[i][0].transcript + " ";
        }

        const num = findFirstNumberInText(fullTranscript);

        if (num !== null) {
          // We got a number, show it and stop listening
          captured = true;
          numberDisplay.textContent = num;
          statusDiv.textContent = "Captured number: " + num;
          recognition.stop();
          listening = false;
        }
      };

      recognition.onerror = (event) => {
        statusDiv.textContent = "Error: " + event.error;
        listening = false;
      };

      recognition.onend = () => {
        if (!captured) {
          statusDiv.textContent = "Stopped listening. Click the button and try again.";
        }
        listening = false;
      };
    }
  </script>
</body>
</html>
